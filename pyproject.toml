[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortexweave-core"
version = "0.1.2"
description = "Shared core library (config, logging, context, ADK tool helpers) for agentic applications generated by ai_agent_builder."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Jitendra Settypalli", email = "jitendra.settypallil@cortexweave.ai"},
]

dependencies = [
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "cryptography==45.0.3",
    "google-adk>=1.25.0,<2.0.0",
    "google-cloud-kms==3.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cortexweave_core"]

[tool.ruff]
target-version = "py312"
line-length = 88
